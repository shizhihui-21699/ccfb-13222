<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可验证年会抽奖</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; line-height: 1.6; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; margin-top: 2em; }
  .card { border: 1px solid #8884; border-radius: 10px; padding: 16px 20px; margin: 14px 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem;
          word-break: break-all; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input[type=text], textarea { width: 100%; padding: 8px; border: 1px solid #8886;
          border-radius: 6px; font: inherit; background: transparent; color: inherit; }
  textarea { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
  button { padding: 8px 18px; border: 0; border-radius: 6px; background: #2563eb; color: #fff;
           font: inherit; cursor: pointer; margin-top: 10px; }
  button.ghost { background: #8883; color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #8884; padding: 5px 10px; text-align: left; font-size: .9rem; }
  .ok { color: #16a34a; font-weight: 600; } .bad { color: #dc2626; font-weight: 600; }
  .muted { opacity: .65; font-size: .85rem; }
  .winner { font-size: 1.05rem; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem;
          background: #8882; }
  a { color: #2563eb; cursor: pointer; }
  .err { color: #dc2626; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
